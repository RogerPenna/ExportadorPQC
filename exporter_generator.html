                <select style="width: 100%; padding: 4px; font-size: 0.72rem; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 4px;" onchange="if(this.value){ moveColumnToGroup(this.value, '${item.id}'); this.value=''; }">
                  <option value="">+ Adicionar Campo a este Grupo...</option>
                  ${sec.columns.filter(c => {
                    return !item.cols.some(s => s.colId === c.colId);
                  }).map(c => `<option value="${c.colId}">${c.label} (${c.colId})</option>`).join('')}
                </select>
              </div>
            </div>
          `;
        } else if (item.type === 'column') {
          const colIdx = sec.columns.findIndex(c => c.colId === item.colId);
          if (colIdx === -1) return;
          const col = sec.columns[colIdx];
          const isFormula = col.type && (col.type.toLowerCase().includes('formula') || col.isFormula);
          const availableGroups = sec.layoutItems.filter(i => i.type === 'group');

          html += `
            <div class="drawer-column-card" draggable="true" data-layout-index="${itemIdx}" data-colid="${col.colId}" ondragstart="onLayoutItemDragStart(event)" ondragover="onLayoutItemDragOver(event)" ondrop="onLayoutItemDrop(event, null)" ondragend="onLayoutItemDragEnd(event)" style="padding: 8px 10px; margin-bottom: 4px; position: relative;">
              <div class="drawer-column-card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div class="drawer-column-title" style="display: flex; align-items: center; gap: 4px; position: relative;">
                  <span style="color: var(--text-muted); cursor: grab; margin-right: 2px; padding: 2px 4px; border-radius: 3px; background: rgba(255,255,255,0.06); font-size: 0.85rem;" onclick="toggleCardContextMenu(event, '${col.colId}')" title="Clique para abrir Menu | Segure para Arrastar">☰</span>
                  <span style="font-family: monospace; color: #fff; font-size: 0.8rem; font-weight: 600;">${col.colId}</span>
                  ${isFormula ? '<span class="column-tag formula">Fórmula</span>' : `<span class="column-tag">${col.type || 'Texto'}</span>`}
                  ${col.customLabel ? `<span style="font-size: 0.65rem; background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); padding: 1px 4px; border-radius: 4px;" title="Rótulo Alternativo: ${col.customLabel}">Rótulo Alt.</span>` : ''}
                  ${col.refTargetCol ? `<span style="font-size: 0.65rem; background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 1px 4px; border-radius: 4px;" title="Exibindo coluna da referência: ${col.refTargetCol}">🔗 Exibe: ${col.refTargetCol}</span>` : ''}

                  ${renderCardContextMenuHTML(col.colId, false, null, null, itemIdx)}
                </div>
                <div style="display: flex; align-items: center; gap: 3px;">
                  <!-- Icon Ativa -->
                  <button class="preview-btn" style="padding: 2px 4px; font-size: 0.72rem; ${col.enabled !== false ? 'background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: #22c55e;' : 'opacity: 0.4; color: #94a3b8;'}" onclick="toggleDrawerColumnEnabled('${col.colId}')" title="${col.enabled !== false ? 'Coluna Visível no Relatório (clique para ocultar)' : 'Coluna Oculta (clique para exibir)'}">
                    👁️
                  </button>
                  <!-- Icon Usar Rótulo -->
                  <button class="preview-btn" style="padding: 2px 4px; font-size: 0.72rem; ${col.useLabel !== false ? 'background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: #3b82f6;' : 'opacity: 0.4; color: #94a3b8;'}" onclick="toggleDrawerColumnLabelMode('${col.colId}')" title="${col.useLabel !== false ? 'Exibindo Rótulo (clique para usar ID puro)' : 'Exibindo ID Puro (clique para usar Rótulo)'}">
                    🏷️
                  </button>
                  <!-- Up/Down arrows -->
                  <button class="preview-btn" onclick="moveLayoutItem(${itemIdx}, 'up')" title="Mover para Cima">▲</button>
                  <button class="preview-btn" onclick="moveLayoutItem(${itemIdx}, 'down')" title="Mover para Baixo">▼</button>
                </div>
              </div>
              
              <!-- Line 2: 2 columns (Label on left, Group Dropdown on right) -->
              <div style="display: flex; gap: 8px; align-items: center; margin-top: 5px;">
                <div style="flex: 1; font-size: 0.72rem; color: ${col.customLabel ? '#fbbf24' : '#60a5fa'}; background: ${col.customLabel ? 'rgba(245, 158, 11, 0.08)' : 'rgba(59, 165, 250, 0.05)'}; padding: 3px 6px; border-radius: 4px; border: 1px solid ${col.customLabel ? 'rgba(245, 158, 11, 0.25)' : 'rgba(59, 165, 250, 0.1)'}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="Rótulo no Relatório: ${col.customLabel || col.label}">
                  Rótulo: <b>${col.customLabel || col.label}</b> ${col.customLabel ? `<span style="color:#94a3b8; font-size:0.68rem; font-weight:normal;">(Grist: ${col.label})</span>` : ''} ${col.refTargetCol ? `<span style="color:#60a5fa; font-size:0.68rem; font-weight:normal;"> (Ref $\rightarrow$ ${col.refTargetCol})</span>` : ''}
                </div>

                <div style="width: 140px;">
                  ${availableGroups.length > 0 ? `
                    <select style="font-size: 0.7rem; padding: 2px 4px; background: #0f172a; color: #93c5fd; border: 1px solid #334155; border-radius: 4px; width: 100%;" onchange="if(this.value){ moveColumnToGroup('${col.colId}', this.value); }">
                      <option value="">+ No Grupo...</option>
                      ${availableGroups.map(g => `<option value="${g.id}">${g.title || 'Grupo'}</option>`).join('')}
                    </select>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }
      });

      html += `</div>`;

      container.innerHTML = html;
    }

    function createColumnGroup() {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      syncLayoutItems(sec);
      const grpId = 'grp_' + Math.random().toString(36).substring(2, 9);
      const numGrps = sec.layoutItems.filter(i => i.type === 'group').length + 1;
      const newGrp = {
        type: 'group',
        id: grpId,
        title: 'Grupo #' + numGrps,
        cols: []
      };
      sec.layoutItems.unshift(newGrp); // Add to TOP
      renderDrawerColumns();
      updatePreview();
    }

    function moveLayoutItem(index, direction) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;

      if (direction === 'up' && index > 0) {
        const temp = sec.layoutItems[index];
        sec.layoutItems[index] = sec.layoutItems[index - 1];
        sec.layoutItems[index - 1] = temp;
      } else if (direction === 'down' && index < sec.layoutItems.length - 1) {
        const temp = sec.layoutItems[index];
        sec.layoutItems[index] = sec.layoutItems[index + 1];
        sec.layoutItems[index + 1] = temp;
      }

      updateColumnsOrderFromLayout(sec);
      renderDrawerColumns();
      updatePreview();
    }

    function updateColumnsOrderFromLayout(sec) {
      const newColOrder = [];
      const colMap = new Map((sec.columns || []).map(c => [c.colId, c]));

      sec.layoutItems.forEach(item => {
        if (item.type === 'column') {
          const col = colMap.get(item.colId);
          if (col) {
            newColOrder.push(col);
            colMap.delete(item.colId);
          }
        } else if (item.type === 'group' && item.cols) {
          item.cols.forEach(slot => {
            const col = colMap.get(slot.colId);
            if (col) {
              newColOrder.push(col);
              colMap.delete(slot.colId);
            }
          });
        }
      });

      colMap.forEach(col => newColOrder.push(col));
      sec.columns = newColOrder;
    }

    function removeColumnGroup(groupId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;

      const grpIdx = sec.layoutItems.findIndex(i => i.type === 'group' && i.id === groupId);
      if (grpIdx === -1) return;

      const grp = sec.layoutItems[grpIdx];
      const releasedItems = (grp.cols || []).map(slot => ({ type: 'column', colId: slot.colId }));

      sec.layoutItems.splice(grpIdx, 1, ...releasedItems);
      updateColumnsOrderFromLayout(sec);

      renderDrawerColumns();
      updatePreview();
    }

    function recalculateGroupWidths(grp, changedColId = null, userTypedValue = null) {
      if (!grp || !grp.cols || grp.cols.length === 0) return;

      if (changedColId !== null && userTypedValue !== null) {
        const changedSlot = grp.cols.find(s => s.colId === changedColId);
        if (changedSlot) {
          let val = parseFloat(userTypedValue);
          if (isNaN(val)) val = 25;
          changedSlot.width = Math.min(99, Math.max(1, val));
        }
      }

      // Collect fixed (locked OR user-edited) slots
      const fixedCols = new Set();
      let sumFixed = 0;

      grp.cols.forEach(slot => {
        if (slot.locked || slot.colId === changedColId) {
          fixedCols.add(slot.colId);
          sumFixed += parseFloat(slot.width) || 0;
        }
      });

      const freeCols = grp.cols.filter(slot => !fixedCols.has(slot.colId));

      if (freeCols.length > 0) {
        const remaining = Math.max(0, 100 - sumFixed);
        const share = Math.round((remaining / freeCols.length) * 10) / 10;
        freeCols.forEach(slot => {
          slot.width = share;
        });
      }
    }

    function moveColumnToGroup(colId, targetGroupId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      syncLayoutItems(sec);

      let sourceGroup = null;
      sec.layoutItems.forEach(item => {
        if (item.type === 'group' && item.cols) {
          const slotIdx = item.cols.findIndex(s => s.colId === colId);
          if (slotIdx !== -1) {
            sourceGroup = item;
            item.cols.splice(slotIdx, 1);
            recalculateGroupWidths(sourceGroup);
          }
        }
      });

      const standaloneIdx = sec.layoutItems.findIndex(i => i.type === 'column' && i.colId === colId);
      if (standaloneIdx !== -1) {
        sec.layoutItems.splice(standaloneIdx, 1);
      }

      if (targetGroupId) {
        const targetGrp = sec.layoutItems.find(i => i.type === 'group' && i.id === targetGroupId);
        if (targetGrp) {
          if (!targetGrp.cols) targetGrp.cols = [];
          targetGrp.cols.push({ colId: colId, width: 0, locked: false });
          recalculateGroupWidths(targetGrp);
        }
      } else {
        let insertIdx = sec.layoutItems.length;
        if (sourceGroup) {
          const sIdx = sec.layoutItems.findIndex(i => i.type === 'group' && i.id === sourceGroup.id);
          if (sIdx !== -1) insertIdx = sIdx + 1;
        }
        sec.layoutItems.splice(insertIdx, 0, { type: 'column', colId: colId });
      }

      updateColumnsOrderFromLayout(sec);
      renderDrawerColumns();
      updatePreview();
    }

    function onGroupColWidthChange(groupId, colId, width) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;
      const grp = sec.layoutItems.find(i => i.type === 'group' && i.id === groupId);
      if (!grp || !grp.cols) return;
      
      recalculateGroupWidths(grp, colId, width);
      renderDrawerColumns();
      updatePreview();
    }

    function toggleColLockInGroup(groupId, colId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;
      const grp = sec.layoutItems.find(i => i.type === 'group' && i.id === groupId);
      if (!grp || !grp.cols) return;

      const slot = grp.cols.find(s => s.colId === colId);
      if (slot) {
        slot.locked = !slot.locked;
        renderDrawerColumns();
        updatePreview();
      }
    }

    let dragLayoutIndex = null;

    function onLayoutItemDragStart(e) {
      dragLayoutIndex = parseInt(e.currentTarget.getAttribute('data-layout-index'));
      const colId = e.currentTarget.getAttribute('data-colid');
      if (colId) e.dataTransfer.setData('text/plain', colId);
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onLayoutItemDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function onLayoutItemDrop(e, targetGroupId) {
      e.preventDefault();
      const colId = e.dataTransfer.getData('text/plain');
      const targetLayoutIdx = parseInt(e.currentTarget.getAttribute('data-layout-index'));
      const sec = findSectionById(reportSections, activeDrawerSectionId);

      if (targetGroupId && colId) {
        moveColumnToGroup(colId, targetGroupId);
      } else if (!isNaN(targetLayoutIdx) && dragLayoutIndex !== null && dragLayoutIndex !== targetLayoutIdx) {
        const item = sec.layoutItems[dragLayoutIndex];
        sec.layoutItems.splice(dragLayoutIndex, 1);
        sec.layoutItems.splice(targetLayoutIdx, 0, item);
        updateColumnsOrderFromLayout(sec);
        renderDrawerColumns();
        updatePreview();
      }
    }

    function onLayoutItemDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      dragLayoutIndex = null;
    }

    let dragSrcIndex = null;

    function onColumnDragStart(e) {
      dragSrcIndex = parseInt(e.currentTarget.getAttribute('data-index'));
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function onColumnDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function onColumnDrop(e) {
      e.preventDefault();
      const dragTargetIndex = parseInt(e.currentTarget.getAttribute('data-index'));
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || dragSrcIndex === null || dragSrcIndex === dragTargetIndex) return;

      const temp = sec.columns[dragSrcIndex];
      sec.columns.splice(dragSrcIndex, 1);
      sec.columns.splice(dragTargetIndex, 0, temp);

      renderDrawerColumns();
      updatePreview();
    }

    function onColumnDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      dragSrcIndex = null;
    }

    function toggleDrawerColumnEnabled(colIdOrIdx) {
      logDebug(`toggleDrawerColumnEnabled: ${colIdOrIdx} para seção ativa: ${activeDrawerSectionId}`);
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      let col = null;
      if (typeof colIdOrIdx === 'string') {
        col = sec.columns.find(c => c.colId === colIdOrIdx);
      } else {
        col = sec.columns[colIdOrIdx];
      }
      if (col) {
        col.enabled = !col.enabled;
        logDebug(`Campo da gaveta '${col.colId}' habilitado setado para: ${col.enabled}`);
        renderDrawerColumns();
        updatePreview();
      }
    }

    function toggleDrawerColumnLabelMode(colIdOrIdx) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      let col = null;
      if (typeof colIdOrIdx === 'string') {
        col = sec.columns.find(c => c.colId === colIdOrIdx);
      } else {
        col = sec.columns[colIdOrIdx];
      }
      if (col) {
        col.useLabel = col.useLabel === false ? true : false;
        renderDrawerColumns();
        updatePreview();
      }
    }

    function toggleDrawerColumnGristStyle(idx) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (sec && sec.columns[idx]) {
        sec.columns[idx].useGristStyle = sec.columns[idx].useGristStyle === false ? true : false;
        updatePreview();
      }
    }

    function removeSection(secId) {
      removeSectionRecursive(reportSections, secId);
      renderSectionsManager();
      updatePreview();
    }

    function removeSectionRecursive(sections, id) {
      const idx = sections.findIndex(s => s.id === id);
      if (idx !== -1) {
        sections.splice(idx, 1);
        return true;
      }
      for (const sec of sections) {
        if (removeSectionRecursive(sec.children, id)) return true;
      }
      return false;
    }

    function moveSection(secId, direction) {
      const findParentArray = (sections) => {
        const idx = sections.findIndex(s => s.id === secId);
        if (idx !== -1) return { array: sections, index: idx };
        for (const sec of sections) {
          const res = findParentArray(sec.children);
          if (res) return res;
        }
        return null;
      };
      
      const res = findParentArray(reportSections);
      if (!res) return;
      const { array, index } = res;
      
      if (direction === 'up' && index > 0) {
        const temp = array[index];
        array[index] = array[index - 1];
        array[index - 1] = temp;
      } else if (direction === 'down' && index < array.length - 1) {
        const temp = array[index];
        array[index] = array[index + 1];
        array[index + 1] = temp;
      }
      
      renderSectionsManager();
      updatePreview();
    }

    function moveColumn(secId, colId, direction) {
      const sec = findSectionById(reportSections, secId);
      if (!sec) return;
      
      const index = sec.columns.findIndex(c => c.colId === colId);
      if (index === -1) return;
      
      if (direction === 'up') {
        let prevIdx = -1;
        for (let i = index - 1; i >= 0; i--) {
          if (sec.columns[i].enabled) {
            prevIdx = i;
            break;
          }
        }
        if (prevIdx !== -1) {
          const temp = sec.columns[index];
          sec.columns[index] = sec.columns[prevIdx];
          sec.columns[prevIdx] = temp;
        }
      } else if (direction === 'down') {
        let nextIdx = -1;
        for (let i = index + 1; i < sec.columns.length; i++) {
          if (sec.columns[i].enabled) {
            nextIdx = i;
            break;
          }
        }
        if (nextIdx !== -1) {
          const temp = sec.columns[index];
          sec.columns[index] = sec.columns[nextIdx];
          sec.columns[nextIdx] = temp;
        }
      }
      
      renderSectionsManager();
      updatePreview();
    }

    function renderSectionsManager() {
      const container = document.getElementById('tree-sections-container');
      container.innerHTML = reportSections.map(sec => renderSectionCardHTML(sec, 0)).join('');
    }

    function renderSectionCardHTML(sec, depth) {
      const indent = depth * 16;
      return `
        <div class="section-card" style="margin-left: ${indent}px; border-left-color: ${depth > 0 ? 'var(--accent)' : 'var(--primary)'}">
          <div class="section-card-header">
            <span class="section-card-title">${depth === 0 ? 'Seção Principal' : 'Sub-seção de ' + sec.parentTableId}</span>
            <div class="section-controls">
              <button class="btn-icon" style="color: var(--primary)" onclick="addChildSection('${sec.id}')">+ Sub-seção</button>
              <button class="btn-icon" style="color: var(--danger)" onclick="removeSection('${sec.id}')">✕</button>
            </div>
          </div>

          <div class="form-group">
            <label>Tabela Grist</label>
            <select id="table-${sec.id}" onchange="onSectionTableChange('${sec.id}')">
              ${gristTables.map(t => `<option value="${t.tableId}" ${t.tableId === sec.tableId ? 'selected' : ''}>${t.tableId}</option>`).join('')}
            </select>
          </div>

          <div class="form-group">
            <label>Título da Seção</label>
            <input type="text" id="title-${sec.id}" value="${sec.title}" oninput="onSectionTitleChange('${sec.id}')">
          </div>

          <div class="form-group">
            <label style="display:flex; justify-content:space-between; align-items:center;">
              <span>Máx. Registros na Pré-visualização</span>
              <span style="font-size:0.72rem; color: var(--text-muted); font-weight:normal;">(0 = ilimitado)</span>
            </label>
            <input type="number" id="maxrec-${sec.id}" value="${sec.maxRecords !== undefined ? sec.maxRecords : (depth === 0 ? 1 : 0)}" min="0" style="width:80px;" oninput="onSectionMaxRecordsChange('${sec.id}')">
          </div>

          <div style="display:flex; gap:8px;">
            <div class="form-group" style="flex:1;">
              <label>Colunas (Grid)</label>
              <select id="cols-${sec.id}" onchange="onSectionColsLayoutChange('${sec.id}')">
                <option value="1" ${(sec.colsLayout||1)==1?'selected':''}>1 Coluna (Padrão)</option>
                <option value="2" ${(sec.colsLayout||1)==2?'selected':''}>2 Colunas</option>
                <option value="3" ${(sec.colsLayout||1)==3?'selected':''}>3 Colunas</option>
                <option value="4" ${(sec.colsLayout||1)==4?'selected':''}>4 Colunas (ex: PDCA)</option>
              </select>
            </div>
            <div class="form-group" style="flex:1;">
              <label>Quebra de Página</label>
              <select id="pgbreak-${sec.id}" onchange="onSectionPageBreakChange('${sec.id}')">
                <option value="avoid" ${sec.pageBreak==='avoid'?'selected':''}>Evitar Corte</option>
                <option value="always" ${sec.pageBreak==='always'?'selected':''}>1 Registro/Página</option>
                <option value="none" ${sec.pageBreak==='none'?'selected':''}>Sem Controle</option>
              </select>
            </div>
          </div>

          ${depth > 0 ? `
            <div class="form-group">
              <label>Coluna de Ligação ao Pai (Filtro)</label>
              <select id="link-${sec.id}" onchange="onSectionLinkChange('${sec.id}')">
                <option value="">-- Sem filtro (mostrar tudo) --</option>
                ${sec.columns.map(c => {
                  const isRef = c.type && (c.type.startsWith('Ref:') || c.type.startsWith('RefList:'));
                  const targetTable = isRef ? (c.type.startsWith('Ref:') ? c.type.substring(4).trim() : c.type.substring(8).trim()) : '';
                  const badge = isRef ? ` 🔗 [Link -> ${targetTable}]` : '';
                  return `<option value="${c.colId}" ${c.colId === sec.linkColumn ? 'selected' : ''}>${c.label} (${c.colId})${badge}</option>`;
                }).join('')}
              </select>
            </div>
          ` : ''}

          <button class="btn-action btn-outline" style="width: 100%; margin-top: 10px; font-size: 0.8rem; padding: 8px;" onclick="openColumnsDrawer('${sec.id}')">
            ⚙ Configurar Colunas (${sec.columns.filter(c => c.enabled).length} selecionadas)
          </button>
        </div>
        ${sec.children.map(child => renderSectionCardHTML(child, depth + 1)).join('')}
      `;
    }

    function updatePreview() {
      const title = document.getElementById('report-title-input').value;
      const subtitle = document.getElementById('report-subtitle-input').value;
      const themeColor = document.getElementById('theme-color-input').value;
      const fontSize = document.getElementById('font-size-select').value;
      const pageMargin = document.getElementById('page-margin-select').value;
      const subIndent = document.getElementById('subsection-indent-select').value;
      const fieldPadding = document.getElementById('field-padding-select').value;
      const cardPadding = document.getElementById('card-padding-select').value;
      const colGap = document.getElementById('col-gap-select').value;

      document.getElementById('pdf-title').innerText = title;
      document.getElementById('pdf-subtitle').innerText = subtitle;
      
      const sheet = document.getElementById('pdf-preview-sheet');
      sheet.style.setProperty('--pdf-theme-color', themeColor);
      sheet.style.setProperty('--pdf-font-size', fontSize);
      sheet.style.setProperty('--pdf-page-margin', pageMargin);
      sheet.style.setProperty('--pdf-sub-indent', subIndent);
      sheet.style.setProperty('--field-padding', fieldPadding);
      sheet.style.setProperty('--card-padding', cardPadding);
      sheet.style.setProperty('--col-gap', colGap);

      // Render hierarchical preview content
      const pdfContent = document.getElementById('pdf-sections-content');
      let parentForRoot = null;
      if (currentTableId !== 'Exportador') {
        parentForRoot = activeGristRecord;
      }
      pdfContent.innerHTML = reportSections.map(sec => renderSectionRecordsHTML(sec, parentForRoot)).join('');

      // Build JSON configuration structure
      const buildConfigJson = (sections) => {
        return sections.map(sec => ({
          id: sec.id,
          tableId: sec.tableId,
          title: sec.title,
          linkColumn: sec.linkColumn,
          maxRecords: sec.maxRecords !== undefined ? sec.maxRecords : 0,
          colsLayout: sec.colsLayout || 1,
          pageBreak: sec.pageBreak || 'avoid',
          layoutItems: (sec.layoutItems || []).map(item => {
            if (item.type === 'group') {
              return {
                type: 'group',
                id: item.id,
                title: item.title,
                cols: (item.cols || []).map(c => ({
                  colId: c.colId,
                  width: parseFloat(c.width) || 25,
                  locked: c.locked === true
                }))
              };
            }
            return { type: 'column', colId: item.colId };
          }),
          columns: sec.columns.map(c => ({
            colId: c.colId,
            label: c.label,
            useLabel: c.useLabel !== false,
            enabled: c.enabled !== false,
            customLabel: c.customLabel || null,
            refTargetCol: c.refTargetCol || null
          })),
          children: buildConfigJson(sec.children)
        }));
      };

      const configJson = {
        title: title,
        subtitle: subtitle,
        themeColor: themeColor,
        fontSize: fontSize,
        hierarchy: buildConfigJson(reportSections)
      };

      document.getElementById('json-config').value = JSON.stringify(configJson, null, 2);
    }

    function formatChoiceValue(valStr, colMeta = null) {
      if (valStr === undefined || valStr === null || valStr === '') return '';

      const trimmed = String(valStr).trim();
      const upper = trimmed.toUpperCase();

      // 1. Check if colMeta has custom choiceOptions from Grist
      if (colMeta && colMeta.widgetOptions) {
        const opts = colMeta.widgetOptions;
        const choiceOpts = opts.choiceOptions || opts.choices;
        if (choiceOpts && typeof choiceOpts === 'object') {
          const matchKey = Object.keys(choiceOpts).find(k => k.trim().toUpperCase() === upper);
          if (matchKey && choiceOpts[matchKey]) {
            const cOpt = choiceOpts[matchKey];
            const bg = cOpt.fillColor || cOpt.bgColor || cOpt.background || null;
            const fg = cOpt.textColor || cOpt.color || null;
            if (bg || fg) {
              const bgCss = bg ? `background-color: ${bg};` : 'background-color: rgba(148, 163, 184, 0.15);';
              const fgCss = fg ? `color: ${fg};` : 'color: inherit;';
              return `<span style="display: inline-block; ${bgCss} ${fgCss} padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85em; font-family: system-ui, -apple-system, sans-serif; line-height: 1.3; box-shadow: 0 1px 2px rgba(0,0,0,0.06);">${valStr}</span>`;
            }
          }
        }
      }

      // 2. Pre-defined color palettes for standard choice options (SIM, NÃO, N/A, etc.)
      if (upper === 'SIM' || upper === 'SI' || upper === 'YES' || upper === 'OK' || upper === 'APROVADO') {
        return `<span style="display: inline-block; background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85em; font-family: system-ui, -apple-system, sans-serif; line-height: 1.3;">${valStr}</span>`;
      }

      if (upper === 'NÃO' || upper === 'NAO' || upper === 'NO' || upper === 'REPROVADO') {
        return `<span style="display: inline-block; background-color: #fce7f3; color: #be185d; border: 1px solid #fbcfe8; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85em; font-family: system-ui, -apple-system, sans-serif; line-height: 1.3;">${valStr}</span>`;
      }

      if (upper === 'N/A' || upper === 'NA' || upper === 'PENDENTE' || upper === 'NÃO APLICÁVEL' || upper === 'NAO APLICAVEL') {
        return `<span style="display: inline-block; background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85em; font-family: system-ui, -apple-system, sans-serif; line-height: 1.3;">${valStr}</span>`;
      }

      // 3. General Choice / ChoiceList formatting if type is Choice / ChoiceList
      if (colMeta && colMeta.type && (colMeta.type === 'Choice' || colMeta.type === 'ChoiceList' || (colMeta.widgetOptions && colMeta.widgetOptions.widget === 'choice'))) {
        return `<span style="display: inline-block; background-color: rgba(148, 163, 184, 0.15); color: #334155; border: 1px solid rgba(148, 163, 184, 0.3); padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 0.85em; font-family: system-ui, -apple-system, sans-serif; line-height: 1.3;">${valStr}</span>`;
      }

      return valStr;
    }

    function formatNumericValue(val, type, colMeta = null) {
      const num = Number(val);
      if (isNaN(num)) return String(val);

      let dec = null;
      if (colMeta && colMeta.widgetOptions) {
        const opts = colMeta.widgetOptions;
        if (opts.decimals !== undefined && opts.decimals !== null && !isNaN(parseInt(opts.decimals))) {
          dec = parseInt(opts.decimals);
        } else if (opts.maxDecimals !== undefined && opts.maxDecimals !== null && !isNaN(parseInt(opts.maxDecimals))) {
          dec = parseInt(opts.maxDecimals);
        }
      }

      if (dec !== null && dec >= 0) {
        return num.toLocaleString('pt-BR', {
          minimumFractionDigits: dec,
          maximumFractionDigits: dec
        });
      }

      if (!Number.isInteger(num)) {
        return num.toLocaleString('pt-BR', {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });
      }

      return num.toLocaleString('pt-BR');
    }

    function formatCellValue(val, type, colMeta = null) {
      if (val === undefined || val === null) return '';

      let formatted = '';
      if (colMeta && colMeta.refTargetCol) {
        formatted = resolveRefDisplayValue(val, type, colMeta);
      } else if (type && (type.startsWith('Ref:') || type.startsWith('RefList:'))) {
        formatted = resolveRefDisplayValue(val, type, colMeta);
      } else if (typeof val === 'boolean' || type === 'Bool') {
        formatted = val ? 'Sim' : 'Não';
      } else if (Array.isArray(val)) {
        let list = val;
        if (val[0] === 'L') {
          list = val.slice(1);
        }
        return list.map(item => {
          let itemStr = item;
          if (item && typeof item === 'object') {
            itemStr = item.label || item.id || JSON.stringify(item);
          }
          return formatChoiceValue(itemStr, colMeta);
        }).join(' ');
      } else if (typeof val === 'object') {
        formatted = val.label || val.id || JSON.stringify(val);
      } else if (type && (type.startsWith('Date') || type.startsWith('DateTime'))) {
        if (typeof val === 'string') {
          const match = val.match(/^(\d{4})-(\d{2})-(\d{2})/);
          if (match) {
            formatted = `${match[3]}/${match[2]}/${match[1]}`;
          } else if (!isNaN(Number(val)) && Number(val) > 0) {
            const num = Number(val);
            const ms = num < 1e11 ? num * 1000 : num;
            const d = new Date(ms);
            if (!isNaN(d.getTime())) {
              const day = String(d.getUTCDate()).padStart(2, '0');
              const month = String(d.getUTCMonth() + 1).padStart(2, '0');
              const year = d.getUTCFullYear();
              formatted = `${day}/${month}/${year}`;
            } else {
              formatted = String(val);
            }
          } else {
            formatted = String(val);
          }
        } else if (typeof val === 'number') {
          if (val > 0) {
            const ms = val < 1e11 ? val * 1000 : val;
            const d = new Date(ms);
            if (!isNaN(d.getTime())) {
              const day = String(d.getUTCDate()).padStart(2, '0');
              const month = String(d.getUTCMonth() + 1).padStart(2, '0');
              const year = d.getUTCFullYear();
              formatted = `${day}/${month}/${year}`;
            } else {
              formatted = String(val);
            }
          } else {
            formatted = String(val);
          }
        } else {
          formatted = String(val);
        }
      } else if (typeof val === 'number') {
        formatted = formatNumericValue(val, type, colMeta);
      } else if (typeof val === 'string' && val.trim() !== '' && !isNaN(Number(val)) && val.includes('.')) {
        formatted = formatNumericValue(val, type, colMeta);
      } else {
        formatted = String(val);
      }

      // Format direction arrows (⬆ / ⬇) as Grist-style colored pill badges
      if (typeof formatted === 'string') {
        const trimmed = formatted.trim();
        if (trimmed === '⬆' || trimmed.includes('⬆')) {
          return `<span style="display: inline-flex; align-items: center; justify-content: center; background: #2563eb; color: #ffffff; padding: 2px 7px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.2; box-shadow: 0 1px 2px rgba(0,0,0,0.15);" title="Melhor Sentido: Subir (⬆)">⬆</span>`;
        }
        if (trimmed === '⬇' || trimmed.includes('⬇')) {
          return `<span style="display: inline-flex; align-items: center; justify-content: center; background: #dc2626; color: #ffffff; padding: 2px 7px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.2; box-shadow: 0 1px 2px rgba(0,0,0,0.15);" title="Melhor Sentido: Descer (⬇)">⬇</span>`;
        }
        return formatChoiceValue(formatted, colMeta);
      }

      return formatted;
    }

    // Recursive records renderer
    function renderSectionRecordsHTML(sec, parentRecord) {
      const activeCols = sec.columns.filter(c => c.enabled);
      
      // Filter records if linking to a parent record
      let filteredRecords = sec.records || [];
      if (parentRecord && sec.linkColumn) {
        const parentVal = parentRecord.id || parentRecord.Email || parentRecord.Nome_da_Empresa;
        filteredRecords = sec.records.filter(row => {
          const rowVal = row[sec.linkColumn];
          if (rowVal === undefined || rowVal === null) return false;
          if (typeof rowVal === 'object' && rowVal !== null) {
            return String(rowVal.id) === String(parentVal) || String(rowVal.label) === String(parentVal);
          }
          return String(rowVal) === String(parentVal);
        });
      }

      // Apply maxRecords limit (0 = unlimited)
      const maxRec = (sec.maxRecords !== undefined && sec.maxRecords > 0) ? sec.maxRecords : Infinity;
      const cappedRecords = filteredRecords.slice(0, maxRec);
      const isCapped = filteredRecords.length > cappedRecords.length;
      
      const recordsHtml = cappedRecords.map((row, rIdx) => {
        const childrenHtml = sec.children.map(child => renderSectionRecordsHTML(child, row)).join('');
        const pageBreakClass = (sec.pageBreak === 'always' && rIdx > 0) ? ' page-break-before-record' : '';

        syncLayoutItems(sec);

        const innerContentBlocks = [];

        (sec.layoutItems || []).forEach(item => {
          if (item.type === 'group') {
            const validCols = (item.cols || []).filter(slot => {
              if (!slot.colId) return false;
              const colMeta = sec.columns.find(col => col.colId === slot.colId);
              return colMeta && colMeta.enabled !== false;
            });

            if (validCols.length === 0) return;

            const showColBorder = document.getElementById('col-border-checkbox')?.checked;
            const gridTemplate = validCols.map(s => (s.width || (100 / validCols.length)) + 'fr').join(' ');

            const groupFieldsHtml = validCols.map((slot, idx) => {
              const colMeta = sec.columns.find(col => col.colId === slot.colId);
              let cellVal = row[colMeta.colId];
              const helperColId = 'gristHelper_Display_' + colMeta.colId;

              if (colMeta.refTargetCol && colMeta.refTargetTable) {
                // Manual ref override: look up via any Ref column in this section that points to the target table
                cellVal = resolveByRefTarget(row, sec, colMeta);
              } else if (colMeta.type && (colMeta.type.startsWith('Ref:') || colMeta.type.startsWith('RefList:'))) {
                cellVal = resolveRefDisplayValue(cellVal, colMeta.type, colMeta);
              } else if (row[helperColId] !== undefined && row[helperColId] !== null && row[helperColId] !== '') {
                cellVal = row[helperColId];
              }

              const val = formatCellValue(cellVal, colMeta.type, colMeta);
              const align = colMeta.widgetOptions?.alignment || 'left';
              const cellBg = colMeta.widgetOptions?.fillColor ? `background-color: ${colMeta.widgetOptions.fillColor}` : '';
              const cellColor = colMeta.widgetOptions?.textColor ? `color: ${colMeta.widgetOptions.textColor}` : '';
              const cellBold = colMeta.widgetOptions?.fontBold ? 'font-weight: bold' : '';
              const cellItalic = colMeta.widgetOptions?.fontItalic ? 'font-style: italic' : '';
              const colName = colMeta.customLabel || (colMeta.useLabel !== false ? colMeta.label : colMeta.colId);

              const isLast = idx === validCols.length - 1;
              const colBorderCss = (showColBorder && !isLast) ? 'border-right: 1px solid #cbd5e1; padding-right: 4px;' : '';

              return `
                <div class="preview-field-container" style="text-align: ${align}; ${colBorderCss}" onclick="onReportFieldClick(event, '${sec.id}', '${colMeta.colId}')" title="Clique para focar este campo na Gaveta de Configuração">
                  <div class="preview-field-controls">
                    <button class="preview-btn" onclick="moveColumn('${sec.id}', '${colMeta.colId}', 'up')" title="Mover Campo para Cima">▲</button>
                    <button class="preview-btn" onclick="moveColumn('${sec.id}', '${colMeta.colId}', 'down')" title="Mover Campo para Baixo">▼</button>
                    <button class="preview-btn delete" onclick="toggleColumn('${sec.id}', '${colMeta.colId}')" title="Desativar Campo">✕</button>
                  </div>
                  <span style="font-size: 7.5pt; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block;">${colName}</span>
                  <span style="font-size: var(--pdf-font-size, 9pt); word-break: break-word; white-space: pre-wrap; ${cellBg}; ${cellColor}; ${cellBold}; ${cellItalic}; padding: 4px; border-radius: 4px; display: inline-block; line-height: 1.4;">${val}</span>
                </div>
              `;
            }).join('');

            innerContentBlocks.push(`
              <div style="display: grid; grid-template-columns: ${gridTemplate}; gap: var(--col-gap, 6px); margin-bottom: 8px; align-items: start; width: 100%;">
                ${groupFieldsHtml}
              </div>
            `);
          } else if (item.type === 'column') {
            const c = sec.columns.find(col => col.colId === item.colId);
            if (!c || c.enabled === false) return;

            let cellVal = row[c.colId];
            const helperColId = 'gristHelper_Display_' + c.colId;

            if (c.refTargetCol && c.refTargetTable) {
              // Manual ref override: look up via any Ref column in this section that points to the target table
              cellVal = resolveByRefTarget(row, sec, c);
            } else if (c.type && (c.type.startsWith('Ref:') || c.type.startsWith('RefList:'))) {
              cellVal = resolveRefDisplayValue(cellVal, c.type, c);
            } else if (row[helperColId] !== undefined && row[helperColId] !== null && row[helperColId] !== '') {
              cellVal = row[helperColId];
            }

            const val = formatCellValue(cellVal, c.type, c);
            const align = c.widgetOptions?.alignment || 'left';
            const cellBg = c.widgetOptions?.fillColor ? `background-color: ${c.widgetOptions.fillColor}` : '';
            const cellColor = c.widgetOptions?.textColor ? `color: ${c.widgetOptions.textColor}` : '';
            const cellBold = c.widgetOptions?.fontBold ? 'font-weight: bold' : '';
            const cellItalic = c.widgetOptions?.fontItalic ? 'font-style: italic' : '';
            const colName = c.customLabel || (c.useLabel !== false ? c.label : c.colId);

            innerContentBlocks.push(`
              <div class="preview-field-container" style="text-align: ${align}; margin-bottom: 8px;" onclick="onReportFieldClick(event, '${sec.id}', '${c.colId}')" title="Clique para focar este campo na Gaveta de Configuração">
                <div class="preview-field-controls">
                  <button class="preview-btn" onclick="moveColumn('${sec.id}', '${c.colId}', 'up')" title="Mover Campo para Cima">▲</button>
                  <button class="preview-btn" onclick="moveColumn('${sec.id}', '${c.colId}', 'down')" title="Mover Campo para Baixo">▼</button>
                  <button class="preview-btn delete" onclick="toggleColumn('${sec.id}', '${c.colId}')" title="Desativar Campo">✕</button>
                </div>
                <span style="font-size: 7.5pt; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block;">${colName}</span>
                <span style="font-size: var(--pdf-font-size, 9pt); word-break: break-word; white-space: pre-wrap; ${cellBg}; ${cellColor}; ${cellBold}; ${cellItalic}; padding: 4px; border-radius: 4px; display: inline-block; line-height: 1.4;">${val}</span>
              </div>
            `);
          }
        });

        return `
          <div class="pdf-record-card${pageBreakClass}" style="${rIdx > 0 && sec.pageBreak === 'always' ? 'margin-top: 0;' : ''}">
            <div class="pdf-record-title">
              <span>Registro #${rIdx + 1}</span>
              <span style="font-weight: normal; color: #94a3b8; font-size: 7.5pt;">Tabela: ${sec.tableId}</span>
            </div>
            ${innerContentBlocks.join('')}
            ${childrenHtml ? `<div style="margin-top: 8px; padding-left: var(--pdf-sub-indent, 6px); border-left: 2px solid var(--pdf-theme-color, #3b82f6);">${childrenHtml}</div>` : ''}
          </div>
        `;
      }).join('');

      const cappedNotice = isCapped ? `<div style="text-align:center; font-size:7.5pt; color:#94a3b8; padding:6px; border:1px dashed #cbd5e1; border-radius:6px; margin-top:4px;">⚠️ Pré-visualização da tabela '${sec.tableId}' limitada a ${maxRec} de ${filteredRecords.length} registros. (Altere o 'Máx. Registros' para 0 no painel esquerdo para ver todos).</div>` : '';

      return `
        <div class="preview-section-container" data-sec-id="${sec.id}">
          <div class="print-only-section-title" style="font-size: 11pt; font-weight: 700; color: var(--pdf-theme-color, #3b82f6); border-bottom: 1.5px solid var(--pdf-theme-color, #3b82f6); padding-bottom: 3px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em;">${sec.title}</div>
          <div class="preview-section-header">
            <span class="preview-section-title">${sec.title}</span>
            <div class="preview-section-controls">
              <button class="preview-btn" onclick="moveSection('${sec.id}', 'up')" title="Mover Seção para Cima">▲</button>
              <button class="preview-btn" onclick="moveSection('${sec.id}', 'down')" title="Mover Seção para Baixo">▼</button>
              <button class="preview-btn delete" onclick="removeSection('${sec.id}')" title="Excluir Seção">✕</button>
            </div>
          </div>
          <div>
            ${recordsHtml.length > 0 ? recordsHtml + cappedNotice : `<div style="text-align: center; color: #94a3b8; padding: 10px; font-size: 8pt; border: 1px dashed #e2e8f0; border-radius: 6px;">Sem dados vinculados em ${sec.title}</div>`}
          </div>
        </div>
      `;
    }

    async function exportPDF() {
      const sheet = document.getElementById('pdf-preview-sheet');
      const rightPanel = document.querySelector('.right-panel');
      if (!sheet) return;

      const savedScrollTop = rightPanel ? rightPanel.scrollTop : 0;
      const savedWindowY = window.scrollY;

      // Scroll container and window to top to ensure html2canvas captures at y=0
      if (rightPanel) rightPanel.scrollTop = 0;
      window.scrollTo(0, 0);

      sheet.classList.add('exporting-pdf');
      
      // Allow DOM, scroll and CSS changes to settle before canvas capture
      await new Promise(r => setTimeout(r, 250));

      const totalHeight = sheet.scrollHeight || sheet.offsetHeight || 1000;
      // Calculate dynamic scale to ensure canvas height stays within browser's 15,000px limit
      const safeScale = Math.max(1, Math.min(2, 15000 / totalHeight));

      logDebug(`Iniciando geração de PDF (Altura: ${totalHeight}px, Escala: ${safeScale.toFixed(2)})...`);

      const opt = {
        margin:       0,
        filename:     `Relatorio_Hierarquico_PQC.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
          scale: safeScale, 
          useCORS: true,
          backgroundColor: '#ffffff',
          scrollY: 0,
          scrollX: 0,
          windowWidth: sheet.scrollWidth || 794,
          windowHeight: totalHeight,
          logging: false,
          onclone: (clonedDoc) => {
            const clonedSheet = clonedDoc.getElementById('pdf-preview-sheet');
            const clonedPanel = clonedDoc.querySelector('.right-panel');
            if (clonedPanel) clonedPanel.scrollTop = 0;
            if (clonedSheet) {
              clonedSheet.style.transform = 'none';
              clonedSheet.style.margin = '0 auto';
              clonedSheet.style.backgroundColor = '#ffffff';
            }
          }
        },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['css', 'legacy'], avoid: ['.pdf-record-card', '.preview-field-container', '.preview-section-container'] }
      };

      try {
        await html2pdf().from(sheet).set(opt).save();
        logDebug("PDF gerado e baixado com sucesso!");
      } catch (err) {
        logDebug("Erro ao gerar PDF: " + err.message);
        console.error("Erro ao gerar PDF:", err);
        alert("Erro ao gerar PDF: " + err.message);
      } finally {
        sheet.classList.remove('exporting-pdf');
        if (rightPanel) rightPanel.scrollTop = savedScrollTop;
        window.scrollTo(0, savedWindowY);
      }
    }

    function exportExcel() {
      const wb = XLSX.utils.book_new();

      const exportTableFromTree = (sections) => {
        sections.forEach(sec => {
          const activeCols = sec.columns.filter(c => c.enabled);
          const headers = activeCols.map(c => c.useLabel !== false ? c.label : c.colId);
          const rows = sec.records.map(row => activeCols.map(c => {
            let cellVal = row[c.colId];
            if (c.type && (c.type.startsWith('Ref:') || c.type.startsWith('RefList:'))) {
              const helperColId = 'gristHelper_Display_' + c.colId;
              if (row[helperColId] !== undefined) {
                cellVal = row[helperColId];
              }
            }
            return formatCellValue(cellVal, c.type);
          }));

          const sheetName = sec.title.replace(/[\[\]\*\?\/\\:]/g, '').substring(0, 30) || sec.tableId;
          let ws = wb.Sheets[sheetName];
          if (ws) {
            const existingData = XLSX.utils.sheet_to_json(ws, { header: 1 });
            ws = XLSX.utils.aoa_to_sheet([...existingData, ...rows]);
            wb.Sheets[sheetName] = ws;
          } else {
            ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
          }

          exportTableFromTree(sec.children);
        });
      };

      exportTableFromTree(reportSections);
      XLSX.writeFile(wb, `Relatorio_Hierarquico_PQC.xlsx`);
    }

    function moveColInsideGroup(groupId, slotIdx, direction) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;

      const grp = sec.layoutItems.find(i => i.type === 'group' && i.id === groupId);
      if (!grp || !grp.cols) return;

      if (direction === 'up' && slotIdx > 0) {
        const temp = grp.cols[slotIdx];
        grp.cols[slotIdx] = grp.cols[slotIdx - 1];
        grp.cols[slotIdx - 1] = temp;
      } else if (direction === 'down' && slotIdx < grp.cols.length - 1) {
        const temp = grp.cols[slotIdx];
        grp.cols[slotIdx] = grp.cols[slotIdx + 1];
        grp.cols[slotIdx + 1] = temp;
      }

      updateColumnsOrderFromLayout(sec);
      renderDrawerColumns();
      updatePreview();
    }

    function onReportFieldClick(event, secId, colId) {
      if (event.target.closest('.preview-field-controls')) return;
      event.stopPropagation();

      openColumnsDrawer(secId);

      setTimeout(() => {
        const container = document.getElementById('drawer-columns-list');
        if (!container) return;

        let targetEl = container.querySelector(`[data-colid="${colId}"]`);
        if (!targetEl) {
          targetEl = container.querySelector(`[data-slot-colid="${colId}"]`);
        }

        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          targetEl.classList.remove('drawer-card-highlight');
          void targetEl.offsetWidth;
          targetEl.classList.add('drawer-card-highlight');
          setTimeout(() => targetEl.classList.remove('drawer-card-highlight'), 1800);
        }
      }, 120);
    }

    function onGroupTitleChange(groupId, newTitle) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;
      const grp = sec.layoutItems.find(i => i.type === 'group' && i.id === groupId);
      if (grp) {
        grp.title = newTitle.trim() || 'Grupo';
        renderDrawerColumns();
        updatePreview();
      }
    }

    let openContextMenuColId = null;

    function toggleCardContextMenu(event, colId) {
      event.stopPropagation();
      openContextMenuColId = (openContextMenuColId === colId) ? null : colId;
      renderDrawerColumns();
    }

    function promptCustomLabel(colId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      const col = (sec.columns || []).find(c => c.colId === colId);
      if (!col) return;

      const currentVal = col.customLabel || col.label || colId;
      const newVal = prompt(`Rótulo alternativo para a coluna '${col.label || colId}' (usado apenas no relatório):`, currentVal);

      if (newVal !== null) {
        const trimmed = newVal.trim();
        if (trimmed && trimmed !== col.label) {
          col.customLabel = trimmed;
        } else {
          delete col.customLabel;
        }
        openContextMenuColId = null;
        renderDrawerColumns();
        updatePreview();
      }
    }

    function clearCustomLabel(colId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      const col = (sec.columns || []).find(c => c.colId === colId);
      if (col) {
        delete col.customLabel;
        openContextMenuColId = null;
        renderDrawerColumns();
        updatePreview();
      }
    }

    function renderCardContextMenuHTML(colId, isGroupSlot = false, groupId = null, slotIdx = null, itemIdx = null) {
      if (openContextMenuColId !== colId) return '';

      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return '';
      const colIdx = sec.columns.findIndex(c => c.colId === colId);
      if (colIdx === -1) return '';
      const col = sec.columns[colIdx];

      return `
        <div style="position: absolute; top: 26px; left: 0; background: #0f172a; border: 1px solid #3b82f6; border-radius: 6px; padding: 4px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.8); min-width: 220px;" onmousedown="event.stopPropagation()">
          <div onclick="promptCustomLabel('${colId}')" class="ctx-btn">
            <span>✏️</span> <span>${col.customLabel ? 'Editar Rótulo Alternativo' : 'Criar Rótulo Alternativo'}</span>
          </div>
          ${col.customLabel ? `
            <div onclick="clearCustomLabel('${colId}')" class="ctx-btn" style="color: #f87171;">
              <span>🗑️</span> <span>Restaurar Rótulo Padrão</span>
            </div>
          ` : ''}
          <div onclick="toggleDrawerColumnLabelMode(${colIdx})" class="ctx-btn">
            <span>🏷️</span> <span>${col.useLabel !== false ? 'Usar ID Puro no Relatório' : 'Usar Rótulo Grist'}</span>
          </div>
          <div onclick="toggleDrawerColumnEnabled(${colIdx})" class="ctx-btn">
            <span>👁️</span> <span>${col.enabled !== false ? 'Ocultar no Relatório' : 'Exibir no Relatório'}</span>
          </div>

          <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 4px 0;"></div>
          <div onclick="promptRefTargetCol('${colId}')" class="ctx-btn" style="color: #60a5fa;">
            <span>🔗</span> <span>${col.refTargetCol ? 'Alterar Coluna Referenciada' : 'Escolher Coluna da Referência'}</span>
          </div>
          ${col.refTargetCol ? `
            <div onclick="clearRefTargetCol('${colId}')" class="ctx-btn" style="color: #f87171;">
              <span>🗑️</span> <span>Restaurar Referência Padrão</span>
            </div>
          ` : ''}

          <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 4px 0;"></div>

          ${isGroupSlot ? `
            <div onclick="moveColInsideGroupSteps('${groupId}', ${slotIdx}, 'top')" class="ctx-btn">
              <span>⏫</span> <span>Topo do Grupo</span>
            </div>
            <div onclick="moveColInsideGroupSteps('${groupId}', ${slotIdx}, -10)" class="ctx-btn">
              <span>⬆️</span> <span>10 Posições para Cima</span>
            </div>
            <div onclick="moveColInsideGroupSteps('${groupId}', ${slotIdx}, 10)" class="ctx-btn">
              <span>⬇️</span> <span>10 Posições para Baixo</span>
            </div>
            <div onclick="moveColInsideGroupSteps('${groupId}', ${slotIdx}, 'bottom')" class="ctx-btn">
              <span>⏬</span> <span>Final do Grupo</span>
            </div>
            <div onclick="moveColumnToGroup('${colId}', null)" class="ctx-btn" style="color:#f87171;">
              <span>🚪</span> <span>Remover deste Grupo</span>
            </div>
          ` : `
            <div onclick="moveLayoutItemSteps(${itemIdx}, 'top')" class="ctx-btn">
              <span>⏫</span> <span>Enviar para o Topo</span>
            </div>
            <div onclick="moveLayoutItemSteps(${itemIdx}, -10)" class="ctx-btn">
              <span>⬆️</span> <span>10 Posições para Cima</span>
            </div>
            <div onclick="moveLayoutItemSteps(${itemIdx}, 10)" class="ctx-btn">
              <span>⬇️</span> <span>10 Posições para Baixo</span>
            </div>
            <div onclick="moveLayoutItemSteps(${itemIdx}, 'bottom')" class="ctx-btn">
              <span>⏬</span> <span>Enviar para o Final</span>
            </div>
          `}
        </div>
      `;
    }

    function moveLayoutItemSteps(itemIdx, steps) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;

      const targetItem = sec.layoutItems[itemIdx];
      if (!targetItem) return;

      let newIdx = itemIdx;
      if (steps === 'top') {
        newIdx = 0;
      } else if (steps === 'bottom') {
        newIdx = sec.layoutItems.length - 1;
      } else {
        newIdx = Math.max(0, Math.min(sec.layoutItems.length - 1, itemIdx + steps));
      }

      if (newIdx !== itemIdx) {
        sec.layoutItems.splice(itemIdx, 1);
        sec.layoutItems.splice(newIdx, 0, targetItem);
        updateColumnsOrderFromLayout(sec);
        openContextMenuColId = null;
        renderDrawerColumns();
        updatePreview();

        setTimeout(() => {
          const container = document.getElementById('drawer-columns-list');
          if (!container) return;
          const colId = targetItem.colId;
          let el = colId ? container.querySelector(`[data-colid="${colId}"]`) : container.querySelector(`[data-layout-index="${newIdx}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.remove('drawer-card-highlight');
            void el.offsetWidth;
            el.classList.add('drawer-card-highlight');
            setTimeout(() => el.classList.remove('drawer-card-highlight'), 1800);
          }
        }, 100);
      }
    }

    function moveColInsideGroupSteps(groupId, slotIdx, steps) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec || !sec.layoutItems) return;
      const grp = sec.layoutItems.find(i => i.type === 'group' && i.id === groupId);
      if (!grp || !grp.cols) return;

      const slot = grp.cols[slotIdx];
      if (!slot) return;

      let newIdx = slotIdx;
      if (steps === 'top') {
        newIdx = 0;
      } else if (steps === 'bottom') {
        newIdx = grp.cols.length - 1;
      } else {
        newIdx = Math.max(0, Math.min(grp.cols.length - 1, slotIdx + steps));
      }

      if (newIdx !== slotIdx) {
        grp.cols.splice(slotIdx, 1);
        grp.cols.splice(newIdx, 0, slot);
        updateColumnsOrderFromLayout(sec);
        openContextMenuColId = null;
        renderDrawerColumns();
        updatePreview();

        setTimeout(() => {
          const container = document.getElementById('drawer-columns-list');
          if (!container) return;
          const el = container.querySelector(`[data-slot-colid="${slot.colId}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.remove('drawer-card-highlight');
            void el.offsetWidth;
            el.classList.add('drawer-card-highlight');
            setTimeout(() => el.classList.remove('drawer-card-highlight'), 1800);
          }
        }, 100);
      }
    }

    document.addEventListener('click', (e) => {
      if (openContextMenuColId !== null && !e.target.closest('.drawer-column-title') && !e.target.closest('.card-ctx-menu')) {
        openContextMenuColId = null;
        renderDrawerColumns();
      }
    });

    async function promptRefTargetCol(colId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      const col = (sec.columns || []).find(c => c.colId === colId);
      if (!col) return;

      let targetTable = '';
      if (col.type && col.type.startsWith('Ref:')) {
        targetTable = col.type.substring(4).trim();
      } else if (col.type && col.type.startsWith('RefList:')) {
        targetTable = col.type.substring(8).trim();
      } else {
        const refCol = (sec.columns || []).find(c => c.type && (c.type.startsWith('Ref:') || c.type.startsWith('RefList:')));
        if (refCol && refCol.type) {
          targetTable = refCol.type.startsWith('Ref:') ? refCol.type.substring(4).trim() : refCol.type.substring(8).trim();
        }
      }

      if (!targetTable) {
        targetTable = sec.tableId;
      }

      const schema = await getTableSchemaCached(targetTable);
      const availableCols = schema ? Object.keys(schema).filter(k => k !== 'id' && k !== 'manualSort' && !k.startsWith('gristHelper_')) : [];

      if (availableCols.length === 0) {
        alert(`Não foi possível carregar a lista de colunas da tabela '${targetTable}'.`);
        return;
      }

      const promptMsg = `Escolha qual coluna da tabela '${targetTable}' você deseja exibir para '${col.label || colId}':\n\n` +
        availableCols.map((c, i) => `${i + 1}. ${c}`).join('\n') +
        `\n\nDigite o NOME da coluna (ou o número de 1 a ${availableCols.length}):`;

      const currentVal = col.refTargetCol || availableCols[0];
      const userInput = prompt(promptMsg, currentVal);

      if (userInput !== null) {
        const trimmed = userInput.trim();
        let selectedCol = null;

        const idx = parseInt(trimmed, 10);
        if (!isNaN(idx) && idx >= 1 && idx <= availableCols.length) {
          selectedCol = availableCols[idx - 1];
        } else {
          const matched = availableCols.find(c => c.toLowerCase() === trimmed.toLowerCase());
          if (matched) selectedCol = matched;
        }

        if (selectedCol) {
          col.refTargetCol = selectedCol;
          col.refTargetTable = targetTable;
          logDebug(`Coluna de referência definida manualmente: ${colId} -> ${targetTable}.${selectedCol}`);
        } else if (trimmed === '') {
          delete col.refTargetCol;
          delete col.refTargetTable;
        } else {
          alert(`Coluna '${trimmed}' não encontrada na tabela '${targetTable}'.`);
        }

        openContextMenuColId = null;
        renderDrawerColumns();
        updatePreview();
      }
    }

    function clearRefTargetCol(colId) {
      const sec = findSectionById(reportSections, activeDrawerSectionId);
      if (!sec) return;
      const col = (sec.columns || []).find(c => c.colId === colId);
      if (col) {
        delete col.refTargetCol;
        delete col.refTargetTable;
        openContextMenuColId = null;
        renderDrawerColumns();
        updatePreview();
      }
    }

    // Expose functions globally for HTML event handlers in ES Module scope
    window.promptRefTargetCol = promptRefTargetCol;
    window.clearRefTargetCol = clearRefTargetCol;
    window.moveLayoutItemSteps = moveLayoutItemSteps;
    window.moveColInsideGroupSteps = moveColInsideGroupSteps;
    window.toggleCardContextMenu = toggleCardContextMenu;
    window.promptCustomLabel = promptCustomLabel;
    window.clearCustomLabel = clearCustomLabel;
    window.onGroupTitleChange = onGroupTitleChange;
    window.toggleColLockInGroup = toggleColLockInGroup;
    window.onReportFieldClick = onReportFieldClick;
    window.addRootSection = addRootSection;
    window.addChildSection = addChildSection;
    window.removeSection = removeSection;
    window.moveSection = moveSection;
    window.moveColumn = moveColumn;
    window.onSectionTableChange = onSectionTableChange;
    window.onSectionTitleChange = onSectionTitleChange;
    window.onSectionLinkChange = onSectionLinkChange;
    window.toggleColumn = toggleColumn;
    window.toggleLabelMode = toggleLabelMode;
    window.updatePreview = updatePreview;
    window.saveConfigToGrist = saveConfigToGrist;
    window.restoreBackupFromGrist = restoreBackupFromGrist;
    window.exportPDF = exportPDF;
    window.exportExcel = exportExcel;

    window.moveLayoutItem = moveLayoutItem;
    window.moveColInsideGroup = moveColInsideGroup;
    window.createColumnGroup = createColumnGroup;
    window.removeColumnGroup = removeColumnGroup;
    window.moveColumnToGroup = moveColumnToGroup;
    window.onGroupColWidthChange = onGroupColWidthChange;
    window.onLayoutItemDragStart = onLayoutItemDragStart;
    window.onLayoutItemDragOver = onLayoutItemDragOver;
    window.onLayoutItemDrop = onLayoutItemDrop;
    window.onLayoutItemDragEnd = onLayoutItemDragEnd;
    window.openColumnsDrawer = openColumnsDrawer;
    window.closeColumnsDrawer = closeColumnsDrawer;
    window.toggleDrawerColumnEnabled = toggleDrawerColumnEnabled;
    window.toggleDrawerColumnLabelMode = toggleDrawerColumnLabelMode;
    window.toggleDrawerColumnGristStyle = toggleDrawerColumnGristStyle;
    window.onColumnDragStart = onColumnDragStart;
    window.onColumnDragOver = onColumnDragOver;
    window.onColumnDrop = onColumnDrop;
    window.onColumnDragEnd = onColumnDragEnd;
  </script>
</body>
</html>
