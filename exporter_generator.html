                const cellBold = c.widgetOptions?.fontBold ? 'font-weight: bold' : '';
                const cellItalic = c.widgetOptions?.fontItalic ? 'font-style: italic' : '';
                const colName = c.useLabel !== false ? c.label : c.colId;
                
                return `
                  <div class="preview-field-container" style="text-align: ${align};">
                    <div class="preview-field-controls">
                      <button class="preview-btn" onclick="moveColumn('${sec.id}', '${c.colId}', 'up')" title="Mover Campo para Cima">▲</button>
                      <button class="preview-btn" onclick="moveColumn('${sec.id}', '${c.colId}', 'down')" title="Mover Campo para Baixo">▼</button>
                      <button class="preview-btn delete" onclick="toggleColumn('${sec.id}', '${c.colId}')" title="Desativar Campo">✕</button>
                    </div>
                    <span style="font-size: 7.5pt; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block;">${colName}</span>
                    <span style="font-size: var(--pdf-font-size, 9pt); word-break: break-word; white-space: pre-wrap; ${cellBg}; ${cellColor}; ${cellBold}; ${cellItalic}; padding: 4px; border-radius: 4px; display: inline-block; line-height: 1.4;">${val}</span>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        return `
          <div class="pdf-record-card${pageBreakClass}" style="${rIdx > 0 && sec.pageBreak === 'always' ? 'margin-top: 0;' : ''}">
            <div class="pdf-record-title">
              <span>Registro #${rIdx + 1}</span>
              <span style="font-weight: normal; color: #94a3b8; font-size: 7.5pt;">Tabela: ${sec.tableId}</span>
            </div>
            ${innerContentHtml}
            ${childrenHtml ? `<div style="margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--pdf-theme-color, #3b82f6);">${childrenHtml}</div>` : ''}
          </div>
        `;
      }).join('');

      const cappedNotice = isCapped ? `<div style="text-align:center; font-size:7.5pt; color:#94a3b8; padding:6px; border:1px dashed #cbd5e1; border-radius:6px; margin-top:4px;">⚠️ Pré-visualização limitada a ${maxRec} de ${filteredRecords.length} registros. No PDF/Excel todos serão exportados.</div>` : '';

      return `
        <div class="preview-section-container" data-sec-id="${sec.id}">
          <div class="print-only-section-title" style="font-size: 11pt; font-weight: 700; color: var(--pdf-theme-color, #3b82f6); border-bottom: 1.5px solid var(--pdf-theme-color, #3b82f6); padding-bottom: 3px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em;">${sec.title}</div>
          <div class="preview-section-header">
            <span class="preview-section-title">${sec.title}</span>
            <div class="preview-section-controls">
              <button class="preview-btn" onclick="moveSection('${sec.id}', 'up')" title="Mover Seção para Cima">▲</button>
              <button class="preview-btn" onclick="moveSection('${sec.id}', 'down')" title="Mover Seção para Baixo">▼</button>
              <button class="preview-btn delete" onclick="removeSection('${sec.id}')" title="Excluir Seção">✕</button>
            </div>
          </div>
          <div>
            ${recordsHtml.length > 0 ? recordsHtml + cappedNotice : `<div style="text-align: center; color: #94a3b8; padding: 10px; font-size: 8pt; border: 1px dashed #e2e8f0; border-radius: 6px;">Sem dados vinculados em ${sec.title}</div>`}
          </div>
        </div>
      `;
    }

    async function exportPDF() {
      const sheet = document.getElementById('pdf-preview-sheet');
      sheet.classList.add('exporting-pdf');
      
      const opt = {
        margin:       10,
        filename:     `Relatorio_Hierarquico_PQC.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        await html2pdf().from(sheet).set(opt).save();
      } catch (err) {
        console.error("Erro ao gerar PDF:", err);
      } finally {
        sheet.classList.remove('exporting-pdf');
      }
    }

    function exportExcel() {
      const wb = XLSX.utils.book_new();

      const exportTableFromTree = (sections) => {
        sections.forEach(sec => {
          const activeCols = sec.columns.filter(c => c.enabled);
          const headers = activeCols.map(c => c.useLabel !== false ? c.label : c.colId);
          const rows = sec.records.map(row => activeCols.map(c => {
            let cellVal = row[c.colId];
            if (c.type && (c.type.startsWith('Ref:') || c.type.startsWith('RefList:'))) {
              const helperColId = 'gristHelper_Display_' + c.colId;
              if (row[helperColId] !== undefined) {
                cellVal = row[helperColId];
              }
            }
            return formatCellValue(cellVal, c.type);
          }));

          const sheetName = sec.title.replace(/[\[\]\*\?\/\\:]/g, '').substring(0, 30) || sec.tableId;
          let ws = wb.Sheets[sheetName];
          if (ws) {
            const existingData = XLSX.utils.sheet_to_json(ws, { header: 1 });
            ws = XLSX.utils.aoa_to_sheet([...existingData, ...rows]);
            wb.Sheets[sheetName] = ws;
          } else {
            ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
          }

          exportTableFromTree(sec.children);
        });
      };

      exportTableFromTree(reportSections);
      XLSX.writeFile(wb, `Relatorio_Hierarquico_PQC.xlsx`);
    }

    // Expose functions globally for HTML event handlers in ES Module scope
    window.addRootSection = addRootSection;
    window.addChildSection = addChildSection;
    window.removeSection = removeSection;
    window.moveSection = moveSection;
    window.moveColumn = moveColumn;
    window.onSectionTableChange = onSectionTableChange;
    window.onSectionTitleChange = onSectionTitleChange;
    window.onSectionLinkChange = onSectionLinkChange;
    window.toggleColumn = toggleColumn;
    window.toggleLabelMode = toggleLabelMode;
    window.updatePreview = updatePreview;
    window.saveConfigToGrist = saveConfigToGrist;
    window.restoreBackupFromGrist = restoreBackupFromGrist;
    window.exportPDF = exportPDF;
    window.exportExcel = exportExcel;

    window.addColumnGroup = addColumnGroup;
    window.removeColumnGroup = removeColumnGroup;
    window.moveColumnGroup = moveColumnGroup;
    window.addSlotToGroup = addSlotToGroup;
    window.removeSlotFromGroup = removeSlotFromGroup;
    window.onSlotColChange = onSlotColChange;
    window.onSlotWidthChange = onSlotWidthChange;
    window.generateDefaultLayout = generateDefaultLayout;
    window.openColumnsDrawer = openColumnsDrawer;
    window.closeColumnsDrawer = closeColumnsDrawer;
    window.toggleDrawerColumnEnabled = toggleDrawerColumnEnabled;
    window.toggleDrawerColumnLabelMode = toggleDrawerColumnLabelMode;
    window.toggleDrawerColumnGristStyle = toggleDrawerColumnGristStyle;
    window.onColumnDragStart = onColumnDragStart;
    window.onColumnDragOver = onColumnDragOver;
    window.onColumnDrop = onColumnDrop;
    window.onColumnDragEnd = onColumnDragEnd;
  </script>
</body>
</html>
